<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Tasbih Counter</title>

<style>
* {
  box-sizing: border-box;
  font-family: "Segoe UI", system-ui, sans-serif;
}

body {
  margin: 0;
  background: linear-gradient(135deg, #0f2027, #203a43, #2c5364);
  min-height: 100vh;
  display: flex;
  justify-content: center;
  align-items: center;
}

/* App Card */
.app {
  width: 92vw;
  max-width: 380px;
  min-height: 75vh;     /* looks tall, still flexible */
  background: #ffffff;
  border-radius: 24px;
  padding: 26px;
  box-shadow: 0 25px 45px rgba(0,0,0,0.35);
}
/* Title */
.title {
  text-align: center;
  font-size: 20px;
  font-weight: 600;
  color: #2c5364;
  margin-bottom: 14px;
}

/* Dhikr selector */
select {
  width: 100%;
  padding: 12px;
  border-radius: 12px;
  border: 1px solid #ddd;
  font-size: 14px;
  margin-bottom: 18px;
  background: #fafafa;
}

/* Counter */
#count {
  text-align: center;
  font-size: 64px;
  font-weight: 700;
  margin: 18px 0;
  color: #2c5364;
}

/* Buttons */
.buttons {
  display: flex;
  flex-direction: column;
  gap: 12px;
}

button {
  padding: 14px;
  border-radius: 16px;
  border: none;
  font-size: 15px;
  font-weight: 500;
  cursor: pointer;
  transition: transform 0.15s ease, box-shadow 0.15s ease;
}

button:active {
  transform: scale(0.97);
}

/* Button styles */
.add {
  background: linear-gradient(135deg, #56ab2f, #a8e063);
  color: #fff;
  box-shadow: 0 6px 18px rgba(86,171,47,0.4);
}

.reset {
  background: linear-gradient(135deg, #cb2d3e, #ef473a);
  color: #fff;
  box-shadow: 0 6px 18px rgba(203,45,62,0.4);
}

.save {
  background: linear-gradient(135deg, #2193b0, #6dd5ed);
  color: #fff;
  box-shadow: 0 6px 18px rgba(33,147,176,0.4);
}

/* History */
.history {
  margin-top: 18px;
  font-size: 13px;
  color: #444;
}

.history strong {
  display: block;
  margin-bottom: 6px;
}

.history ul {
  padding-left: 16px;
  max-height: 120px;
  overflow-y: auto;
}
  /* Small phones (up to 480px) */
@media (max-width: 480px) {
  .app {
    width: 95%;          /* almost full width */
    padding: 20px;       /* smaller padding for tiny screens */
  }

  #count {
    font-size: 48px;     /* slightly smaller count */
  }

  button {
    padding: 12px;       /* smaller buttons */
    font-size: 14px;
  }
}

/* Medium phones / tablets (481px - 767px) */
@media (min-width: 481px) and (max-width: 767px) {
  .app {
    width: 90%;          /* good width for tablets */
    padding: 22px;
  }

  #count {
    font-size: 56px;
  }

  button {
    padding: 13px;
    font-size: 15px;
  }
}

/* Large screens (desktop) already handled with your max-width 400px */
/* Responsive */
@media (min-width: 1025px) {
  .app {
    width: 360px;
  }
}
</style>
</head>

<body>

<div class="app">

  <div class="title">Tasbih Counter</div>

<select id="dhikr">
  <option>سُبْحَانَ اللّٰه</option>
  <option>الْحَمْدُ لِلّٰه</option>
  <option>اللّٰهُ أَكْبَر</option>
  <option>أَسْتَغْفِرُ اللّٰه</option>
  <option>لَا إِلٰهَ إِلَّا اللّٰه</option>
  <option>سُبْحَانَ اللّٰهِ وَبِحَمْدِهِ</option>
  <option>سُبْحَانَ اللّٰهِ الْعَظِيم</option>
  <option>لَا حَوْلَ وَلَا قُوَّةَ إِلَّا بِاللّٰه</option>
  <option>حَسْبِيَ اللّٰهُ لَا إِلٰهَ إِلَّا هُوَ</option>
  <option>رَبِّ اغْفِرْ لِي</option>
  <option>اللّٰهُمَّ صَلِّ عَلَىٰ مُحَمَّد</option>
  <option>يَا اللّٰه</option>
  <option>يَا رَحْمَان</option>
  <option>يَا رَحِيم</option>
  <option>يَا غَفُور</option>
</select>


  <div id="count">0</div>

  <div class="buttons">
    <button class="add" onclick="add()">Add</button>
    <button class="reset" onclick="reset()">Reset</button>
    <button class="save" onclick="save()">Save</button>
  </div>

  <div class="history">
    <strong>Saved History</strong>
    <ul id="history"></ul>
  </div>

</div>

<script>
let count = 0;

// Add count
function add() {
  count++;
  document.getElementById("count").innerText = count;
}

// Reset
function reset() {
  count = 0;
  document.getElementById("count").innerText = count;
}

// Save to LocalStorage
function save() {
  const dhikr = document.getElementById("dhikr").value;
  const history = JSON.parse(localStorage.getItem("tasbih")) || [];

  history.push({
    dhikr: dhikr,
    count: count,
    date: new Date().toLocaleString()
  });

  localStorage.setItem("tasbih", JSON.stringify(history));

  count = 0;
  document.getElementById("count").innerText = 0;
  loadHistory();
}

// Load saved history
function loadHistory() {
  const history = JSON.parse(localStorage.getItem("tasbih")) || [];
  const list = document.getElementById("history");
  list.innerHTML = "";

  history.forEach(item => {
    const li = document.createElement("li");
    li.textContent = `${item.dhikr}: ${item.count} (${item.date})`;
    list.appendChild(li);
  });
}

loadHistory();
</script>

</body>

</html>
